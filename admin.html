<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Painel ADM</title>

<style>
body{
background:#0a0a0a;
color:white;
font-family:Arial;
text-align:center;
}

input{
padding:10px;
margin:10px;
border-radius:5px;
border:none;
}

button{
padding:10px;
background:red;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#ff3b3b;
}
</style>

</head>

<body>

<h1>PAINEL ADM</h1>

<input id="nome" placeholder="Nome do produto"><br>
<input id="preco" placeholder="Preço"><br>
<input id="stock" placeholder="Estoque"><br>
<input id="imagem" placeholder="Link da imagem"><br>

<button onclick="addProduto()">Adicionar Produto</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAkOwU1T92cz1stmo1-VwcXE_nIDp-sk-M",
authDomain: "rdn-store.firebaseapp.com",
databaseURL: "https://rdn-store-default-rtdb.firebaseio.com",
projectId: "rdn-store",
storageBucket: "rdn-store.firebasestorage.app",
messagingSenderId: "29377893404",
appId: "1:29377893404:web:927e49e5f97c0f2368bbd9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.addProduto = function(){

const nome = document.getElementById("nome").value
const preco = document.getElementById("preco").value
const stock = document.getElementById("stock").value
const imagem = document.getElementById("imagem").value

push(ref(db,"produtos"),{
nome,
preco,
stock,
imagem
})

alert("Produto adicionado!")

}

</script>

</body>
</html>
